version: '3'

services:

  mysql:
  image: mysql:8
  container_name: mysql-db
  environment:
    MYSQL_ROOT_PASSWORD: root123
    MYSQL_DATABASE: booksdb
  ports:
    - "3306:3306"
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
    interval: 10s
    timeout: 5s
    retries: 10

  backend:
  build:
    context: .
    dockerfile: Dockerfile.backend
  container_name: backend-app
  ports:
    - "3200:3200"
  depends_on:
    mysql:
      condition: service_healthy
  restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend-app
    restart: always
    depends_on:
      - backend
    ports:
      - "80:3000"
